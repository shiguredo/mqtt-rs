[package]
name = "tokio-mqtt"
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
description = "Tokio-based MQTT client example"
license = "Apache-2.0"
publish = false

[lib]
name = "tokio_mqtt"
path = "src/lib.rs"

[[bin]]
name = "tokio-mqtt"
path = "src/main.rs"

[dependencies]
# コマンドライン引数のパース
noargs = "0.4"
# MQTT クライアント本体（Sans-I/O）
shiguredo_mqtt = { path = "../.." }
# ログ出力
tracing = "0.1"
# ログのフォーマットとサブスクライバ
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# 複数キーを持つ依存はインラインテーブルではなくテーブルセクションで記述する。
# tombi は行長超過のインラインテーブルを複数行に展開するが、複数行インラインテーブルは
# TOML 1.1 の機能であり MSRV (cargo 1.88) ではマニフェストを解析できない。

# MQTT over TLS (mqtts) 用 TLS 実装
# 暗号バックエンドは aws-lc-rs に揃え、ring を持ち込まない
[dependencies.rustls]
version = "0.23"
default-features = false
features = ["aws-lc-rs", "std", "tls12"]

# 非同期 I/O ランタイム（MQTT クライアントの TCP 通信用）
[dependencies.tokio]
version = "1.52"
features = [
  "io-util",
  "macros",
  "net",
  "rt-multi-thread",
  "signal",
  "time",
]

# MQTT over TLS (mqtts) 用 tokio ↔ rustls ブリッジ
[dependencies.tokio-rustls]
version = "0.26"
default-features = false
features = ["aws-lc-rs", "tls12"]

# Mosquitto mqtts テスト用の自己署名 CA / server 証明書の生成に使用
# ring 依存を持ち込まないよう default features を切り、aws_lc_rs backend を使う
[dev-dependencies.rcgen]
version = "0.14"
default-features = false
features = ["aws_lc_rs", "pem"]

# Mosquitto コンテナを起動して MQTT over TCP / TLS の統合テストを行うために使用
# macOS では Apple container、Linux では Docker Engine API を利用する
[dev-dependencies.shiguredo_container]
version = "2026.1.0-canary.1"
